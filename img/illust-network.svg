<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Abstract network/constellation — consulting, strategy, connection -->

  <!-- Primary nodes — central one in terracotta -->
  <circle cx="300" cy="200" r="6" fill="#B5705A" opacity="0.15"/>
  <circle cx="180" cy="280" r="5" fill="#111111" opacity="0.06"/>
  <circle cx="420" cy="280" r="5" fill="#111111" opacity="0.06"/>
  <circle cx="240" cy="140" r="4" fill="#B5705A" opacity="0.1"/>
  <circle cx="380" cy="120" r="4" fill="#111111" opacity="0.05"/>
  <circle cx="140" cy="180" r="3.5" fill="#111111" opacity="0.04"/>
  <circle cx="460" cy="180" r="3.5" fill="#B5705A" opacity="0.08"/>
  <circle cx="300" cy="350" r="4" fill="#111111" opacity="0.05"/>
  <circle cx="200" cy="380" r="3" fill="#111111" opacity="0.04"/>
  <circle cx="400" cy="380" r="3" fill="#111111" opacity="0.04"/>

  <!-- Connecting lines — some in accent -->
  <line x1="300" y1="200" x2="180" y2="280" stroke="#B5705A" stroke-width="0.75" opacity="0.1"/>
  <line x1="300" y1="200" x2="420" y2="280" stroke="#B5705A" stroke-width="0.75" opacity="0.1"/>
  <line x1="300" y1="200" x2="240" y2="140" stroke="#111111" stroke-width="0.75" opacity="0.06"/>
  <line x1="300" y1="200" x2="380" y2="120" stroke="#111111" stroke-width="0.75" opacity="0.06"/>
  <line x1="300" y1="200" x2="300" y2="350" stroke="#111111" stroke-width="0.75" opacity="0.06"/>
  <line x1="240" y1="140" x2="140" y2="180" stroke="#111111" stroke-width="0.5" opacity="0.05"/>
  <line x1="380" y1="120" x2="460" y2="180" stroke="#111111" stroke-width="0.5" opacity="0.05"/>
  <line x1="180" y1="280" x2="200" y2="380" stroke="#111111" stroke-width="0.5" opacity="0.05"/>
  <line x1="420" y1="280" x2="400" y2="380" stroke="#111111" stroke-width="0.5" opacity="0.05"/>
  <line x1="300" y1="350" x2="200" y2="380" stroke="#111111" stroke-width="0.5" opacity="0.05"/>
  <line x1="300" y1="350" x2="400" y2="380" stroke="#111111" stroke-width="0.5" opacity="0.05"/>
  <line x1="180" y1="280" x2="300" y2="350" stroke="#111111" stroke-width="0.5" opacity="0.04"/>
  <line x1="420" y1="280" x2="300" y2="350" stroke="#111111" stroke-width="0.5" opacity="0.04"/>
  <line x1="240" y1="140" x2="380" y2="120" stroke="#111111" stroke-width="0.5" opacity="0.04"/>
  <line x1="140" y1="180" x2="180" y2="280" stroke="#111111" stroke-width="0.5" opacity="0.04"/>
  <line x1="460" y1="180" x2="420" y2="280" stroke="#111111" stroke-width="0.5" opacity="0.04"/>

  <!-- Faint orbit ring — terracotta -->
  <circle cx="300" cy="240" r="160" stroke="#B5705A" stroke-width="0.5" opacity="0.05"/>

  <!-- Secondary scatter -->
  <circle cx="220" cy="210" r="1.5" fill="#111111" opacity="0.04"/>
  <circle cx="360" cy="230" r="1.5" fill="#B5705A" opacity="0.06"/>
  <circle cx="280" cy="310" r="1.5" fill="#111111" opacity="0.03"/>
  <circle cx="350" cy="320" r="1" fill="#111111" opacity="0.03"/>
  <circle cx="160" cy="230" r="1" fill="#111111" opacity="0.03"/>
  <circle cx="440" cy="230" r="1" fill="#111111" opacity="0.03"/>
</svg>
